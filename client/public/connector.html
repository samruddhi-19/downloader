<!DOCTYPE html>
<html>
<head>
  <script src="https://p.trellocdn.com/power-up.min.js"></script>
</head>
<body>

<script>
window.TrelloPowerUp.initialize({

  'board-buttons': function(t) {
    return [{
      icon: {
        dark: 'https://trello-attachment-downloader.vercel.app/icon.svg',
        light: 'https://trello-attachment-downloader.vercel.app/icon.svg'
      },
      text: 'Download Attachments',
      callback: function(t) {
        return t.modal({
          url: 'https://trello-attachment-downloader.vercel.app',
          title: 'Downloader',
          height: 620,
          fullscreen: false
        });
      }
    }];
  },

  'authorization-status': function(t) {
    return t.get('member', 'private', 'token')
      .then(function(token) {
        return { authorized: !!token };
      });
  },

  'show-authorization': function(t) {
    return t.popup({
      title: 'Authorize',
      url: 'https://trello-attachment-downloader.vercel.app/authorize.html',
      height: 140
    });
  }

}, {
  appKey: '6b9d0b80272b4bddecefab2e0b93f8e2',
  appName: 'Downloader'
});
</script>

</body>
</html>
