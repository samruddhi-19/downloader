<!DOCTYPE html>
<html>
<head>
  <script src="https://p.trellocdn.com/power-up.min.js"></script>
</head>
<body>

<script>
// Every URL below is resolved against wherever this connector is served from,
// so the Power-Up always loads the app from the same deployment as itself.
// Hardcoding a host means a redeploy to a different domain silently leaves the
// board button opening a stale build.
var BASE = window.location.origin;

window.TrelloPowerUp.initialize({

  'board-buttons': function(t) {
    return [{
      icon: {
        dark: BASE + '/icon.svg',
        light: BASE + '/icon.svg'
      },
      text: 'Download Attachments',
      callback: function(t) {
        return t.modal({
          url: BASE + '/',
          title: 'Downloader',
          // Trello draws the modal title bar itself, outside our iframe, so no
          // CSS of ours can reach it. Without accentColor it renders the title
          // in Trello's default blue. Must be a full 6-digit hex — the client
          // library rejects shorthand like '#fff'.
          accentColor: '#FFFFFF',
          height: 620,
          fullscreen: false
        });
      }
    }];
  },

  'authorization-status': function(t) {
    return t.get('member', 'private', 'token')
      .then(function(token) {
        return { authorized: !!token };
      });
  },

  'show-authorization': function(t) {
    return t.popup({
      title: 'Authorize',
      url: BASE + '/authorize.html',
      height: 140
    });
  }

}, {
  appKey: '6b9d0b80272b4bddecefab2e0b93f8e2',
  appName: 'Downloader'
});
</script>

</body>
</html>
